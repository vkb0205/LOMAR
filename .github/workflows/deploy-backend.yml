name: Build and Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  PROJECT_ID: lomar-500117
  SERVICE_NAME: lomar-vton-backend
  REGION: us-central1
  IMAGE_NAME: lomar-vton-backend

jobs:
  deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest
    
    # Use service account for authentication
    # Create a service account with Cloud Run Admin and Artifact Registry Writer roles
    permissions:
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_NAME }}:latest ./backend
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_NAME }}:latest \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars="GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }},GOOGLE_CLOUD_LOCATION=global,NANO_BANANA_MODEL=gemini-3.1-flash-image,GOOGLE_TEXT_MODEL=${{ vars.GOOGLE_TEXT_MODEL || 'gemini-2.5-flash' }},API_HOST=0.0.0.0,API_PORT=8080,ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS }},ENABLE_AUTH=${{ vars.ENABLE_AUTH || 'false' }}"

      # --- Auth + CORS secrets (Item 16 / finding F1/F3) ---
      # SUPABASE_JWT_SECRET must NOT be passed via --set-env-vars (it would be
      # visible in the Cloud Run UI). Use a Secret Manager secret instead:
      #   1. Create secret `SUPABASE_JWT_SECRET` in Secret Manager.
      #   2. Grant the Cloud Run runtime service account Secret Accessor on it.
      #   3. Uncomment the --update-secrets line below.
      # --update-secrets=SUPABASE_JWT_SECRET=SUPABASE_JWT_SECRET:latest
      #
      # Set these as GitHub repo VARIABLES (Settings -> Secrets and variables ->
      # Actions -> Variables) so they are injected above without encryption:
      #   ALLOWED_ORIGINS  e.g. https://<user>.github.io
      #   ENABLE_AUTH      true once SUPABASE_JWT_SECRET is wired
      #   GOOGLE_TEXT_MODEL (optional, defaults to gemini-2.5-flash)
        
      - name: Get Service URL
        id: service-url
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format="value(status.url)")
          echo "service_url=$SERVICE_URL" >> $GITHUB_OUTPUT

      - name: Output Service URL
        run: |
          echo "✅ Deployed to: ${{ steps.service-url.outputs.service_url }}"